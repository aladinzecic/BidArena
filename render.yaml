# Render Blueprint: API (Docker, free) + frontend (static site, free).
# Baza je na Neon-u, slike na Cloudflare R2 (vrednosti označene sync: false unosiš u Render panelu).
# Uputstvo: DEPLOY-RENDER.md
services:
  - type: web
    name: bidarena-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/BidArena.Api/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: Database__MigrateOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false   # Neon: Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: BidArena
      - key: Jwt__Audience
        value: BidArena.Client
      - key: FileStorage__Provider
        value: R2
      - key: R2__ServiceUrl
        sync: false   # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: R2__Bucket
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__PublicBaseUrl
        sync: false   # https://pub-xxxx.r2.dev (bez završne /)

  - type: web
    name: bidarena-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Isti origin za frontend i API (frontend poziva relativno /api/v1/...).
      # Ako ime servisa bidarena-api bude zauzeto, promeni ga gore i ovde.
      - type: rewrite
        source: /api/*
        destination: https://bidarena-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
