# Render Blueprint: API (Docker, free) + frontend (static site, free).
# Baza je na Neon-u, slike na Supabase Storage preko S3 API-ja (isti kod radi i za Cloudflare R2).
# Vrednosti označene sync: false unosiš u Render panelu.
# Uputstvo: DEPLOY-RENDER.md
services:
  - type: web
    name: bidarena-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/BidArena.Api/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: Database__MigrateOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false   # Neon: Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: BidArena
      - key: Jwt__Audience
        value: BidArena.Client
      - key: FileStorage__Provider
        value: R2
      - key: R2__ServiceUrl
        sync: false   # Supabase: https://<project-ref>.storage.supabase.co/storage/v1/s3 (R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com)
      - key: R2__Bucket
        sync: false   # ime bucket-a, npr. slike
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__PublicBaseUrl
        sync: false   # Supabase: https://<project-ref>.supabase.co/storage/v1/object/public/<bucket> (bez završne /)
      - key: R2__Region
        sync: false   # Supabase: region projekta, npr. eu-west-1 (za R2 ostavi prazno)
      - key: R2__DisablePayloadSigning
        value: "false"   # Supabase traži potpisan sadržaj; za R2 stavi true

  - type: web
    name: bidarena-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Isti origin za frontend i API (frontend poziva relativno /api/v1/...).
      # Ako ime servisa bidarena-api bude zauzeto, promeni ga gore i ovde.
      - type: rewrite
        source: /api/*
        destination: https://bidarena-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
